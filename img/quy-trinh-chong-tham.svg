<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-label="Minh họa quy trình chống thấm sân thượng. Không phải việc đã làm.">
  <rect width="720" height="1040" fill="#F4F5F6"/>
  <text x="360" y="64" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#1B1F24">Làm thế nào</text>
  <text x="360" y="96" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="16" fill="#A8ADB4">Minh họa quy trình. Không phải việc đã làm.</text>
  <path d="M220 118 H340 L360 130 L380 118 H500" fill="none" stroke="#0D7A7A" stroke-width="3"/>
  <g font-family="DejaVu Sans, Liberation Sans, sans-serif">
    <line x1="96" y1="210" x2="96" y2="894" stroke="#A8ADB4" stroke-width="2"/>
    
    <circle cx="96" cy="210" r="32" fill="#0D7A7A"/>
    <text x="96" y="218" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
    <rect x="148" y="168" width="500" height="84" rx="14" fill="#FFFFFF" stroke="#ECEEEF"/>
    
    <g>
      <rect x="168" y="182" width="44" height="56" rx="8" fill="none" stroke="#1B1F24" stroke-width="2.2"/>
      <rect x="176" y="192" width="28" height="20" fill="#F4F5F6" stroke="#1B1F24" stroke-width="1.6"/>
      <path d="M180 206 h8" stroke="#0D7A7A" stroke-width="2"/>
      <circle cx="190" y="226" r="2.2" fill="#A8ADB4"/>
    </g>
    <text x="232" y="206" font-size="22" font-weight="700" fill="#1B1F24">Ảnh Zalo</text>
    <text x="232" y="230" font-size="16" fill="#4A5158">Gửi ảnh sân và trần.</text>

    <circle cx="96" cy="360" r="32" fill="#0D7A7A"/>
    <text x="96" y="368" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
    <rect x="148" y="318" width="500" height="84" rx="14" fill="#FFFFFF" stroke="#ECEEEF"/>
    
    <g>
      <rect x="176" y="196" width="28" height="40" fill="#F4F5F6" stroke="#1B1F24" stroke-width="2.2"/>
      <rect x="182" y="202" width="8" height="10" fill="none" stroke="#1B1F24" stroke-width="1.5"/>
      <rect x="194" y="202" width="4" height="10" fill="none" stroke="#1B1F24" stroke-width="1.5"/>
      <rect x="184" y="218" width="8" height="18" fill="none" stroke="#1B1F24" stroke-width="1.5"/>
      <path d="M176 196 h28" stroke="#0D7A7A" stroke-width="2.5"/>
    </g>
    <text x="232" y="356" font-size="22" font-weight="700" fill="#1B1F24">Xem nhà</text>
    <text x="232" y="380" font-size="16" fill="#4A5158">Qua xem mặt sân, chỗ nước vào.</text>

    <circle cx="96" cy="510" r="32" fill="#0D7A7A"/>
    <text x="96" y="518" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
    <rect x="148" y="468" width="500" height="84" rx="14" fill="#FFFFFF" stroke="#ECEEEF"/>
    
    <g>
      <rect x="174" y="184" width="36" height="48" rx="2" fill="#FFFFFF" stroke="#1B1F24" stroke-width="2.2"/>
      <path d="M180 196 H204 L210 202 H204 H180 Z" fill="none" stroke="#0D7A7A" stroke-width="2"/>
      <line x1="182" y1="212" x2="204" y2="212" stroke="#A8ADB4" stroke-width="2"/>
      <line x1="182" y1="220" x2="198" y2="220" stroke="#A8ADB4" stroke-width="2"/>
    </g>
    <text x="232" y="506" font-size="22" font-weight="700" fill="#1B1F24">Hợp đồng</text>
    <text x="232" y="530" font-size="16" fill="#4A5158">Công ty, làm phần nào, ghi trên giấy.</text>

    <circle cx="96" cy="660" r="32" fill="#0D7A7A"/>
    <text x="96" y="668" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
    <rect x="148" y="618" width="500" height="84" rx="14" fill="#FFFFFF" stroke="#ECEEEF"/>
    
    <g>
      <rect x="170" y="214" width="40" height="10" fill="#F4F5F6" stroke="#1B1F24" stroke-width="1.8"/>
      <path d="M174 218 H206" stroke="#0D7A7A" stroke-width="2.5"/>
      <path d="M188 214 L206 190 L214 196 L196 218 Z" fill="#FFFFFF" stroke="#1B1F24" stroke-width="2"/>
    </g>
    <text x="232" y="656" font-size="22" font-weight="700" fill="#1B1F24">Làm</text>
    <text x="232" y="680" font-size="16" fill="#4A5158">Làm đúng phần đã ký.</text>

    <circle cx="96" cy="810" r="32" fill="#0D7A7A"/>
    <text x="96" y="818" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
    <rect x="148" y="768" width="500" height="84" rx="14" fill="#FFFFFF" stroke="#ECEEEF"/>
    
    <g>
      <rect x="170" y="196" width="44" height="28" fill="#F4F5F6" stroke="#1B1F24" stroke-width="2.2"/>
      <path d="M170 214 H214" stroke="#0D7A7A" stroke-width="2.5"/>
      <rect x="170" y="214" width="44" height="10" fill="#0D7A7A" fill-opacity="0.18"/>
    </g>
    <text x="232" y="806" font-size="22" font-weight="700" fill="#1B1F24">Thử nước, rồi giao</text>
    <text x="232" y="830" font-size="16" fill="#4A5158">Thử nước xong mới bàn giao.</text>

  </g>
</svg>
