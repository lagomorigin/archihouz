<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-label="Minh họa quy trình chống thấm. Không phải việc đã làm.">
  <rect width="720" height="1040" fill="#F4F5F6"/>
  <text x="360" y="64" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#1B1F24">Làm thế nào</text>
  <text x="360" y="96" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="16" fill="#A8ADB4">Minh họa quy trình. Không phải việc đã làm.</text>
  <!-- sealed line under title -->
  <path d="M220 118 H340 L360 130 L380 118 H500" fill="none" stroke="#0D7A7A" stroke-width="3" stroke-linejoin="miter"/>

  <g font-family="DejaVu Sans, Liberation Sans, sans-serif">
    <!-- connector -->
    <line x1="96" y1="210" x2="96" y2="900" stroke="#A8ADB4" stroke-width="2"/>

    <!-- 1 -->
    <circle cx="96" cy="210" r="28" fill="#0D7A7A"/>
    <text x="96" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">1</text>
    <rect x="148" y="168" width="500" height="84" rx="12" fill="#FFFFFF"/>
    <!-- phone + image -->
    <rect x="168" y="186" width="40" height="48" rx="6" fill="none" stroke="#1B1F24" stroke-width="2"/>
    <rect x="176" y="196" width="24" height="18" fill="#F4F5F6" stroke="#0D7A7A" stroke-width="1.5"/>
    <text x="228" y="218" font-size="22" font-weight="700" fill="#1B1F24">Ảnh Zalo</text>
    <text x="228" y="242" font-size="16" fill="#4A5158">Gửi ảnh sân và trần.</text>

    <!-- 2 -->
    <circle cx="96" cy="360" r="28" fill="#0D7A7A"/>
    <text x="96" y="370" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
    <rect x="148" y="318" width="500" height="84" rx="12" fill="#FFFFFF"/>
    <rect x="172" y="340" width="36" height="28" fill="none" stroke="#1B1F24" stroke-width="2"/>
    <polygon points="168,340 190,324 216,340" fill="none" stroke="#1B1F24" stroke-width="2"/>
    <text x="228" y="368" font-size="22" font-weight="700" fill="#1B1F24">Xem nhà</text>
    <text x="228" y="392" font-size="16" fill="#4A5158">Qua xem mặt sân, chỗ nước vào.</text>

    <!-- 3 -->
    <circle cx="96" cy="510" r="28" fill="#0D7A7A"/>
    <text x="96" y="520" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">3</text>
    <rect x="148" y="468" width="500" height="84" rx="12" fill="#FFFFFF"/>
    <rect x="170" y="486" width="34" height="44" fill="none" stroke="#1B1F24" stroke-width="2"/>
    <line x1="176" y1="498" x2="198" y2="498" stroke="#0D7A7A" stroke-width="2"/>
    <line x1="176" y1="508" x2="198" y2="508" stroke="#A8ADB4" stroke-width="2"/>
    <line x1="176" y1="518" x2="192" y2="518" stroke="#A8ADB4" stroke-width="2"/>
    <text x="228" y="518" font-size="22" font-weight="700" fill="#1B1F24">Hợp đồng</text>
    <text x="228" y="542" font-size="16" fill="#4A5158">Công ty, làm phần nào, ghi trên giấy.</text>

    <!-- 4 -->
    <circle cx="96" cy="660" r="28" fill="#0D7A7A"/>
    <text x="96" y="670" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">4</text>
    <rect x="148" y="618" width="500" height="84" rx="12" fill="#FFFFFF"/>
    <rect x="176" y="640" width="28" height="36" rx="2" fill="none" stroke="#1B1F24" stroke-width="2"/>
    <path d="M174 644 h32" stroke="#0D7A7A" stroke-width="3"/>
    <text x="228" y="668" font-size="22" font-weight="700" fill="#1B1F24">Làm</text>
    <text x="228" y="692" font-size="16" fill="#4A5158">Làm đúng phần đã ký.</text>

    <!-- 5 -->
    <circle cx="96" cy="810" r="28" fill="#0D7A7A"/>
    <text x="96" y="820" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">5</text>
    <rect x="148" y="768" width="500" height="84" rx="12" fill="#FFFFFF"/>
    <circle cx="190" cy="810" r="16" fill="none" stroke="#1B1F24" stroke-width="2"/>
    <path d="M182 810 l6 6 l12 -14" fill="none" stroke="#0D7A7A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="818" font-size="22" font-weight="700" fill="#1B1F24">Thử nước, rồi giao</text>
    <text x="228" y="842" font-size="16" fill="#4A5158">Thử nước xong mới bàn giao.</text>
  </g>
</svg>
